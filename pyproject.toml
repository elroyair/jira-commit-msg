[project]
name = "jira-commit-msg"
version = "0.10.0"
description = "commit-msg hook to enforce branch naming and add issue IDs to commits"
authors = [{ name = "Elroy Air", email = "github@elroyair.com" }]
repository = "https://github.com/elroyair/jira-commit-msg"
requires-python = ">=3.12, <3.15"
dependencies = [
    "gitpython (>=3.1.41, <4.0.0)",
    "jira (>=3.5.2, <4.0.0)",
    "python-dotenv (>=1.0.0, <2.0.0)",
    "pyyaml (>=6.0.1, <7.0)",
]

[project.scripts]
jira-commit-msg = "jira_commit_msg.main:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".git", ".venv"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
]
ignore = [
    "E731",  # do not assign a lambda expression, use a def
    "E203",  # whitespace before ':'
    "E501",  # line too long
    "C901",  # ignore "complex" methods and if statements
]
extend-select = [
    "UP",  # pyupgrade
    "PLC0415",  # import-outside-top-level
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
order-by-type = true
relative-imports-order = "closest-to-furthest"
extra-standard-library = ["typing"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["jira_commit_msg"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",  # Module imported but unused
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
