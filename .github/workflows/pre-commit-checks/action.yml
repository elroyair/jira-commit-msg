name: "pre-commit checks"
description: "Runs pre-commit checks on repository"
runs:
  using: "composite"
  steps:
    - name: Setup python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Run pre-commit checks
      uses: pre-commit/action@v3.0.1
      with:
        extra_args: --show-diff-on-failure --all-files
